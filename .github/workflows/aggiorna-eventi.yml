name: Aggiorna eventi

# Rigenera la pagina eventi.html dal foglio Google "luoghi" (tab "eventi").
# Gira ogni notte e a richiesta manuale.

on:
  schedule:
    # 02:00 UTC = 04:00 ora italiana legale (CEST) / 03:00 ora solare (CET)
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-eventi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Serve solo all'ultimo passo, le prove di fumo. Sta qui e non li' perche'
      # setup-node vuole girare prima di qualsiasi npm.
      - name: Setup Node
        # v7 e non v4: la v4 gira su un runtime Node 20 che GitHub ha deprecato,
        # e ogni run finiva con un avviso. Node 22 per le prove: e' la versione
        # di supporto lungo su cui Playwright e' provato.
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Dipendenze Python
        run: pip install --quiet Pillow

      - name: Genera miniature
        # Ridimensiona le locandine nuove per gli ELENCHI e le mette in git.
        # Gira PRIMA di genera_eventi.py: quello guarda se il file esiste per
        # decidere se puntarci, quindi una locandina arrivata stanotte entra
        # nelle pagine gia' con la sua miniatura.
        #
        # Se una singola immagine non si scarica non fallisce niente:
        # loc_path() ripiega sull'originale e la pagina esce comunque.
        run: python scripts/genera_miniature.py

      - name: Genera eventi
        # NON passiamo piu' EVENTI_CSV_URL: quel secret (CSV "Pubblica sul web")
        # veniva servito in cache da Google e faceva rigenerare dati vecchi. Lo
        # script ora usa l'export gviz (live) con cache-buster -> sempre fresco.
        run: python scripts/genera_eventi.py

      - name: Genera centri
        # Legge la tab "Centri estivi" del foglio. Se la tab non esiste o e'
        # vuota la pagina si genera lo stesso, fuori stagione, con la guida.
        run: python scripts/genera_centri.py

      - name: Genera corsi
        # Legge la tab "Attivita" del foglio (i corsi annuali: societa' sportive,
        # scuole di musica, danza, lingue). Se la tab non c'e' o non e' leggibile
        # NON riscrive niente e la pagina resta com'e': leggi_corsi() torna None
        # e main() esce senza toccare il file. La distinzione fra "letto e vuoto"
        # e "non letto" e' l'unica cosa che impedisce a un timeout di Google di
        # pubblicare una pagina svuotata.
        run: python scripts/genera_corsi.py

      - name: Genera rubriche
        # Legge i testi in contenuti/rubriche/. Serve girare ogni notte anche
        # se i testi non cambiano: un articolo con data futura resta fuori
        # dall'indice finche' non arriva il suo giorno, ed e' questa run a
        # farlo comparire da solo.
        run: python scripts/genera_rubriche.py

      - name: Genera luoghi
        # DOPO genera_eventi.py, e non prima: legge data/eventi.json e
        # data/storico-comuni.json appena riscritti per sapere quanti eventi ha
        # ospitato ogni posto e cosa c'e' in programma. Girando prima userebbe
        # l'istantanea di ieri, cioe' scriverebbe "in programma" su cose gia'
        # passate.
        #
        # Il catalogo vero e' il tab "Luoghi" del foglio: se non esiste ancora
        # la pagina si genera lo stesso con i luoghi che l'agenda conosce, e
        # non fallisce niente.
        run: python scripts/genera_luoghi.py

      - name: Genera la collana Esploratore
        # DOPO genera_eventi.py, perche' tocca sitemap.xml, che quello riscrive
        # per blocchi: girando prima, il suo lastmod verrebbe sovrascritto.
        #
        # Fino al 31/08/2026 questo passo NON C'ERA, e nemmeno esploratore.html
        # nell'elenco dei file committati qui sotto. La pagina si aggiornava
        # solo a mano: e' lo stesso guasto gia' descritto per ferragosto.html e
        # per le altre stagionali, con l'aggravante che qui non lo prendeva
        # nessuna rete di sicurezza, perche' il file non veniva nemmeno
        # riscritto nel runner.
        run: python scripts/genera_ginetto.py

      - name: Genera le pagine idea
        # DOPO genera_luoghi.py, e non e' indifferente: importa genera_luoghi
        # per il catalogo e per il suo CSS, e prende i cinque posti per CODICE.
        # Girando prima userebbe l'istantanea di ieri.
        #
        # Stessa storia del passo qui sopra: mancava, quindi /idee/ viveva
        # fuori dalla run notturna. E l'elenco dei file committati porta la
        # CARTELLA e non un file: una pagina idea nuova nasce untracked, e
        # `git status --untracked-files=no` non la vedrebbe. E' la ragione gia'
        # scritta per corsi/ e guide/.
        run: python scripts/genera_idee.py

      - name: Guide stagionali in PDF
        # Ultimo di tutti, e non e' indifferente: legge le pagine GIA' scritte
        # dai passi sopra (fra i marker GUIDA-PDF) e le stampa. Girando prima
        # stamperebbe la pagina di ieri.
        #
        # Non fallisce mai la run: senza Chromium, o se la stampa non riesce,
        # lascia il PDF dell'altra volta e lo scrive nel log. Un PDF vecchio di
        # un giorno e' meglio di nessun PDF, e molto meglio di uno vuoto — che
        # a differenza di una pagina non lo correggi piu' una volta che gira.
        #
        # CHROMIUM_PATH: il runner di GitHub ha Chrome preinstallato in PATH,
        # quindi la ricerca automatica lo trova da sola e la variabile serve
        # solo a chi gira in locale con un binario altrove.
        run: python scripts/genera_pdf.py

      - name: Commit se cambiato
        run: |
          # eventi/ e data/pagine-evento.json vanno inclusi: sono le pagine per
          # singola sagra e il registro che le tiene in vita quando l'evento
          # esce dal foglio. Senza, verrebbero rigenerate a ogni run e perse.
          #
          # Stessa ragione per gli altri file generati, che fino all'08/08/2026
          # NON erano in elenco e quindi ogni notte venivano riscritti nel
          # runner e buttati via con lui:
          #   data/storico-comuni.json  l'archivio "quali feste tornano ogni
          #     anno". Non venendo mai committato non accumulava niente: ogni
          #     run ripartiva dallo stesso file fermo al 7 agosto, ed e' la
          #     sola cosa che regge le pagine fuori stagione.
          #   data/pagine-comune.json, data/pagine-landing.json  i registri dei
          #     lastmod: senza, la sitemap dichiara "modificata oggi" a ogni giro.
          #   zone.html, sagre-provincia-*.html  pagine generate come le altre.
          #   luoghi.html, data/luoghi.json  l'elenco dei posti e l'istantanea
          #     del catalogo, che fa da ripiego quando il foglio non risponde -
          #     stessa funzione che data/eventi.json ha per l'agenda.
          #   ferragosto.html  il 13/08/2026 non era in NESSUNA delle due liste
          #     (ne' qui ne' in FILE_GENERATI_SITO del downloader): rigenerata a
          #     ogni run e pubblicata mai. Online ne dichiarava 62 mentre il
          #     foglio ne aveva 89, e c'era arrivata solo per caso dentro due
          #     commit di stile su un link. Le due liste vanno tenute uguali.
          #
          #   data/conteggi.json  quanti eventi, luoghi, centri e corsi ci sono:
          #     lo scrive OGNI generatore (conteggio_scrivi) e lo rilegge il
          #     successivo per la riga blocco_ecosistema(). Nato il 20/08 e
          #     committato a mano quel giorno, non era in elenco: dalla notte
          #     dopo i quattro numeri si riscrivevano nel runner e morivano con
          #     lui, cioe' la riga online sarebbe restata ferma per sempre ai
          #     conteggi del giorno della nascita. E' lo stesso guasto di
          #     ferragosto.html, alla dodicesima ripetizione.
          #
          #   data/centri-stagioni.json  quali stagioni hanno centri, cioe' la
          #     voce che la nav stampa su ~360 pagine. Nato il 21/08 e mancante
          #     da questo elenco dalla prima run: tredicesima ripetizione dello
          #     stesso guasto, e stavolta non silenziosa — essendo un file
          #     tracciato, la rete di sicurezza in fondo avrebbe fatto diventare
          #     rossa la run notturna.
          #
          #   guide/ + data/guide.json  le guide stagionali in PDF (dal 24/08).
          #     Vale il caso di corsi/: un PDF nuovo nasce UNTRACKED — la prima
          #     volta che una stagione ha date, e poi a ogni cambio d'anno
          #     ("estivi-2027.pdf" e' un file nuovo, non una modifica di
          #     "estivi-2026.pdf") — quindi la rete di sicurezza in fondo, che
          #     guarda solo i file gia' tracciati, non lo vedrebbe. Da qui la
          #     cartella e non un elenco. data/guide.json invece e' tracciato ed
          #     e' quello che fa comparire il link in pagina: senza, il PDF
          #     verrebbe committato e non lo linkerebbe nessuno.
          #
          #   data/realta-pagine.json  quali realta' dei corsi hanno una pagina
          #     in /corsi/ (dal 28/08). Lo scrive genera_corsi.py e lo legge
          #     genera_eventi.py al giro DOPO, per stampare sulla scheda di un
          #     evento il rimando alla realta' che lo organizza. Senza, quel
          #     rimando sparisce dalle ~400 schede alla prima run che non lo
          #     trova, e nessuno se ne accorge: e' un link in meno, non un
          #     errore.
          #
          #   corsi/  le pagine dedicate delle realta' (dal 21/08). Nascono
          #     UNTRACKED, quando una societa' nuova entra nella tab Realta: e'
          #     l'unico caso in cui la rete di sicurezza NON avrebbe protetto,
          #     perche' guarda solo i file gia' tracciati. `git add corsi/` le
          #     prende comunque, ed e' il motivo per cui qui c'e' la cartella e
          #     non un elenco di file.
          #
          # L'elenco e' raggruppato per generatore, e ogni generatore va letto
          # per intero quando se ne aggiunge uno: il 18/08/2026 mancavano tutte
          # e sei le stagionali nate dopo ferragosto (befana, capodanno,
          # carnevale, halloween, natale, pasqua), piu' piscine.html e i due
          # centri non estivi. Erano tracciate in git perche' committate a mano
          # il giorno che sono nate, e da allora la run notturna le riscriveva
          # nel runner e le buttava via con lui: online restavano ferme al
          # giorno della nascita. E' lo stesso guasto gia' descritto qui sotto
          # per ferragosto.html, ripetuto nove volte.
          #
          # La rete di sicurezza sta in fondo al workflow ("Nessun file
          # generato resta indietro"): se un generatore nuovo scrive un file
          # che non e' in questo elenco, la run diventa rossa invece di
          # perderlo in silenzio.
          FILE="eventi.html index.html metodo.html zone.html \
                sagre-provincia-*.html \
                eventi-provincia-*.html \
                befana.html capodanno.html carnevale.html ferragosto.html \
                halloween.html natale.html pasqua.html \
                centri-estivi.html centri-invernali.html centri-pasquali.html \
                rubriche.html luoghi.html piscine.html corsi.html \
                esploratore.html \
                data/eventi.json data/pagine-evento.json data/pagine-comune.json \
                data/pagine-landing.json data/storico-comuni.json \
                data/messaggio-canale.txt data/luoghi.json data/luoghi-comuni.json \
                data/rubriche.json data/conteggi.json data/centri-stagioni.json \
                data/guide.json data/realta-pagine.json \
                eventi/ rubriche/ corsi/ guide/ idee/ assets/miniature/"
          # Solo i file che esistono davvero. `git add` su un percorso che non
          # c'e' non e' un avviso, e' un `fatal:` che ferma la run: e
          # data/luoghi.json nasce solo quando il tab "Luoghi" del foglio
          # esiste, quindi fino a quel giorno l'elenco ne conterrebbe uno
          # inesistente. La stessa protezione vale per tutto il resto.
          PRESENTI=""
          for f in $FILE; do [ -e "$f" ] && PRESENTI="$PRESENTI $f"; done
          if [ -n "$(git status --porcelain $PRESENTI)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $PRESENTI sitemap.xml
            git commit -m "Aggiornamento automatico eventi"
            git push
          else
            # nessun cambiamento ai contenuti: scarta il bump di lastmod
            git checkout -- sitemap.xml 2>/dev/null || true
            echo "Nessuna modifica agli eventi."
          fi

      - name: Controlla i dati strutturati
        # Gira DOPO il commit, e non prima, di proposito. Un Event non valido su
        # una pagina e' un guaio; il sito fermo per un giorno intero, con gli
        # eventi di ieri ancora in agenda, e' un guaio piu' grosso. Cosi' il
        # sito si aggiorna comunque e la run diventa rossa: l'errore si vede
        # subito e si corregge nel foglio, invece di restare invisibile fino al
        # prossimo controllo di Search Console.
        run: python scripts/valida_jsonld.py

      - name: Prove di fumo sulle pagine generate
        # Stessa scelta del passo qui sopra: DOPO il commit. Il sito si
        # aggiorna comunque, e se qualcosa si e' rotto la run diventa rossa.
        #
        # valida_jsonld.py legge l'HTML, quindi vede i dati strutturati ma non
        # il JavaScript: filtri, righe che si aprono, link calendario
        # ricostruito al volo, ancore #ev-. Sono proprio le parti che si
        # rompono in silenzio - la pagina SEMBRA a posto - e che nessuno
        # scopre finche' non ci prova qualcuno col telefono in piazza.
        #
        # if: always() perche' se i dati strutturati falliscono queste prove
        # servono comunque: sono due guasti diversi e conviene vederli insieme
        # invece di scoprirne uno per volta a un giorno di distanza.
        if: always()
        run: |
          cd tests
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Controlla le guide in PDF
        # Il PDF e' l'unico artefatto del sito che non si corregge dopo: una
        # pagina sbagliata la riscrive la run di stanotte, un file scaricato su
        # un telefono ci resta. E i difetti che ha avuto nascendo erano tutti
        # silenziosi - il file c'era, pesava, si apriva.
        #
        # Non serve rete ne' Chromium: la parte grossa prova le trasformazioni
        # di stampa su una pagina finta scritta dentro lo script, quindi gira
        # anche nei giorni in cui il foglio non si legge. Poi guarda i PDF
        # veri, se ci sono.
        #
        # if: always() per la stessa ragione delle prove di fumo: sono guasti
        # diversi e conviene vederli insieme.
        if: always()
        run: python scripts/valida_pdf.py

      - name: Controlla il riaggancio dell'edizione
        # Questa e' l'unica prova del repo che difende una cosa che succede fra
        # DODICI MESI: che la sagra del 2027 aggiorni la pagina del 2026 invece
        # di aprirne una nuova che riparte da zero. Un difetto li' dentro non si
        # vede mai - il sito continua a funzionare benissimo - e si scopre il
        # prossimo agosto guardando perche' la prima pagina del sito ha smesso
        # di prendere clic. Per questo gira ogni notte anche se la cosa che
        # prova non capita mai: e' esattamente il caso in cui una prova a mano
        # marcisce.
        #
        # Offline e in due secondi: legge il registro e simula i nomi dell'anno
        # prossimo. Come le due qui sopra sta DOPO il commit, quindi non puo'
        # fermare il deploy.
        if: always()
        run: python scripts/prova_riaggancio.py

      - name: La scheda spostata e quella ritirata
        # Aggiunte il 02/09/2026, e il motivo e' che ESISTEVANO GIA' senza
        # girare mai: due suite scritte il 30/08 e mai messe qui, cioe' verdi
        # solo quando qualcuno le lanciava a mano. E' lo stesso guasto gia'
        # pagato per genera_ginetto.py e genera_idee.py, con l'aggravante che
        # una prova che non gira e' peggio di una prova che non c'e': fa
        # credere che quel pezzo sia difeso.
        #
        # Cosa difendono, e quanto costa il verso sbagliato: il 02/09/2026
        # /eventi/palio-di-asti-sabato-05-settembre.html era un RIMANDO
        # sbagliato (mandava a una grigliata in un'altra provincia) e faceva
        # 5.887 impressioni, la seconda pagina del sito, allo 0,93% di CTR,
        # mentre la scheda vera del Palio ne prendeva zero. Un rimando sbagliato
        # non si vede da nessuna parte: la pagina esiste, si apre, e' scritta
        # bene, e in SERP dice solo "Scheda spostata".
        #
        # Offline, pochi secondi, in una cartella temporanea. Come le altre sta
        # DOPO il commit, quindi non puo' fermare il deploy.
        if: always()
        run: |
          python scripts/prova_spostata.py
          python scripts/prova_ritirata.py

      - name: La pagina corsi senza corsi
        # Il ramo vuoto di render() in genera_corsi.py: quello che corsi.html
        # dice quando non ha nemmeno un corso da mostrare.
        #
        # PERCHE' GIRA OGNI NOTTE UNA PROVA DI UNA COSA CHE NON CAPITA MAI. E'
        # la stessa ragione di prova_riaggancio qui sopra, ed e' anzi piu'
        # stretta: in pagina ci sono undici corsi e ci sono sempre stati, quindi
        # quel ramo non l'ha mai visto nessuno - e infatti fino al 02/09/2026
        # diceva "Le prime schede stanno arrivando", cioe' prometteva sopra il
        # vuoto (l'invariante del 17/08: zero schede, intro onesta).
        #
        # E non resta un ramo morto: il giorno che i corsi si dividono per
        # provincia (CORSI_PER_PROVINCIA in genera_corsi.py) Alessandria e Asti
        # nascono senza un corso, cioe' il codice mai eseguito diventa in una
        # notte due pagine su tre. Scoprirlo quel giorno vuol dire scoprirlo
        # online.
        #
        # Le prove in tests/ qui non arrivano: aprono i file HTML che stanno su
        # disco, e un corsi.html vuoto su disco non c'e'.
        #
        # Offline e in un secondo: chiama render() con la lista vuota, non
        # scrive niente. Come le altre sta DOPO il commit e non ferma il deploy.
        if: always()
        run: python scripts/prova_corsi_vuoti.py

      - name: Il credito sotto la foto dei luoghi
        # PASSO 2 del TODO "Copyright foto" (02/09/2026). I termini di Places
        # chiedono di citare l'autore accanto alla foto, e l'attribuzione arriva
        # come HTML SCRITTO DA GOOGLE nella colonna FotoAutore del foglio: fa un
        # giro lungo (Places -> uno script Node -> un foglio che scrivono in due
        # persone -> gviz) e non si stampa cosi' com'e'.
        #
        # La prova controlla che da quella colonna escano solo un nome escapato
        # e un link verso google.com, che senza autore non si stampi NIENTE (il
        # caso delle 712 righe vecchie) e che il paragrafo resti attaccato alla
        # foto dentro la riga del luogo - da dove lo prendono anche /piscine.html
        # e le pagine /idee, che riusano la stessa riga.
        #
        # Il rischio che difende non e' una causa: e' che Google spenga la
        # chiave, e allora si ferma anche l'aggancio dei luoghi.
        #
        # Offline e in un secondo: chiama le funzioni, non scrive niente. Come le
        # altre sta DOPO il commit e non ferma il deploy.
        if: always()
        run: python scripts/prova_credito_foto.py

      - name: Nessun file generato resta indietro
        # Rete di sicurezza sull'elenco FILE del passo "Commit se cambiato".
        # Un file gia' tracciato che risulta modificato e NON e' stato
        # committato vuol dire che un generatore lo riscrive e nessuno lo
        # pubblica: online resta la versione del giorno in cui e' nato, e non
        # se ne accorge nessuno perche' niente diventa rosso. E' successo per
        # ferragosto.html (13/08/2026) e per altre nove pagine (18/08/2026).
        #
        # Gira per ultimo e con if: always() apposta: il sito si e' gia'
        # aggiornato, e questa non deve coprire i due controlli qui sopra.
        if: always()
        run: |
          RESTI="$(git status --porcelain --untracked-files=no | sed 's/^...//')"
          if [ -n "$RESTI" ]; then
            echo "::error::Questi file sono stati rigenerati ma non committati:"
            echo "$RESTI"
            echo "Aggiungili all'elenco FILE del passo \"Commit se cambiato\"."
            exit 1
          fi
          echo "Tutto quello che i generatori hanno riscritto e' stato pubblicato."
